<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 297" width="432mm" height="297mm">
  <defs>
    <!-- Crisp White Sky down to soft atmospheric mist -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="42%" stop-color="#FFFFFF" />
      <stop offset="62%" stop-color="#F4F8F8" />
      <stop offset="82%" stop-color="#E2EEF0" />
      <stop offset="100%" stop-color="#CDE3E6" />
    </linearGradient>

    <!-- Mountain Layers (Kampong Thom Ranges / Phnom Santuk) -->
    <linearGradient id="mountDist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24788A" />
      <stop offset="100%" stop-color="#185B69" />
    </linearGradient>
    <linearGradient id="mountMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#165B6A" />
      <stop offset="100%" stop-color="#0E424E" />
    </linearGradient>
    <linearGradient id="mountNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E4754" />
      <stop offset="100%" stop-color="#072F38" />
    </linearGradient>

    <!-- Water & Land Gradients -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#125666" />
      <stop offset="40%" stop-color="#0C414D" />
      <stop offset="100%" stop-color="#072931" />
    </linearGradient>
    <linearGradient id="baseGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#072931" />
      <stop offset="100%" stop-color="#03161B" />
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. MASTER PRISTINE SKY (CLEAN WHITE TO ATMOSPHERIC MIST) -->
  <!-- ============================================================ -->
  <rect x="0" y="0" width="432" height="297" fill="url(#skyGrad)" />

  <!-- ============================================================ -->
  <!-- 2. LAYERED MOUNTAIN RIDGES (KAMPONG THOM RANGES) -->
  <!-- ============================================================ -->
  <!-- Distant Ridge: Soft rolling peaks with serrated forest textures -->
  <path d="
    M0,165
    Q25,160 50,163 T100,158 Q130,154 160,160 T220,152
    Q260,148 300,155 T370,149 Q405,145 432,150
    L432,297 L0,297 Z
  " fill="url(#mountDist)" opacity="0.65" />

  <!-- Distant Jagged Tree Peaks -->
  <path d="
    M10,163 L16,158 L22,162 L32,156 L40,161 L55,154 L68,160
    L90,152 L105,157 L130,149 L145,155 L175,147 L190,153
    L225,145 L242,151 L275,143 L290,149 L325,141 L342,147
    L375,140 L395,146 L420,138 L432,143
    L432,297 L0,297 Z
  " fill="url(#mountDist)" opacity="0.75" />

  <!-- Mid Mountain Range: Darker, richer teal -->
  <path d="
    M0,172
    Q35,166 75,170 T155,164 Q195,160 235,167 T315,161
    Q365,156 432,162
    L432,297 L0,297 Z
  " fill="url(#mountMid)" opacity="0.88" />

  <!-- Near Mountain Ridge & Foothills -->
  <path d="
    M0,178
    L18,173 L26,177 L42,170 L52,175 L74,168 L88,174
    L115,166 L130,172 L160,164 L178,171 L208,162 L225,169
    L255,161 L272,168 L305,159 L322,166 L355,158 L375,165
    L410,156 L432,161
    L432,297 L0,297 Z
  " fill="url(#mountNear)" />

  <!-- ============================================================ -->
  <!-- 3. STUNG SEN RIVER & WATERWAYS -->
  <!-- ============================================================ -->
  <path d="
    M0,184
    C40,181 90,186 145,183
    C205,180 255,185 310,182
    C365,179 400,184 432,181
    L432,248
    C390,245 330,250 265,246
    C205,243 140,248 85,245
    C40,243 15,246 0,244 Z
  " fill="url(#waterGrad)" />

  <!-- Horizontal Luminous Cyan Ripple Streaks -->
  <g stroke="#3BB0C4" stroke-width="0.85" stroke-linecap="round" opacity="0.8">
    <line x1="20" y1="189" x2="70" y2="189" />
    <line x1="85" y1="194" x2="155" y2="194" stroke-width="1.2" stroke="#68CCE0" />
    <line x1="35" y1="199" x2="115" y2="199" />
    <line x1="175" y1="188" x2="245" y2="188" />
    <line x1="210" y1="195" x2="285" y2="195" stroke-width="1.1" stroke="#68CCE0" />
    <line x1="290" y1="190" x2="370" y2="190" />
    <line x1="320" y1="197" x2="415" y2="197" stroke-width="1.3" stroke="#68CCE0" />
    <line x1="245" y1="203" x2="335" y2="203" />
    <line x1="75" y1="206" x2="185" y2="206" />
    <line x1="340" y1="209" x2="425" y2="209" />
    <line x1="145" y1="214" x2="260" y2="214" />
    <line x1="25" y1="219" x2="110" y2="219" />
  </g>

  <!-- Rice Paddy Bunds / Field Levees (Perspective diagonals) -->
  <path d="M210,240 L265,214 L335,202 L432,196 L432,208 L345,212 L270,226 L210,248 Z" fill="#0A3640" opacity="0.9" />
  <path d="M265,214 L235,238 L175,250 L175,256 L242,242 L270,226 Z" fill="#072A32" opacity="0.9" />

  <!-- ============================================================ -->
  <!-- 4. RUSTIC WOODEN FENCE (RIGHT FOREGROUND) -->
  <!-- ============================================================ -->
  <g stroke="#051C22" stroke-linecap="round" opacity="0.95">
    <path d="M355,200 L432,197" stroke-width="1.8" />
    <path d="M357,206 L432,203" stroke-width="1.6" />
    <line x1="360" y1="196" x2="360" y2="210" stroke-width="2.4" />
    <line x1="370" y1="195" x2="370" y2="211" stroke-width="2.1" />
    <line x1="380" y1="194" x2="380" y2="210" stroke-width="2.3" />
    <line x1="392" y1="193" x2="392" y2="211" stroke-width="2.1" />
    <line x1="404" y1="192" x2="404" y2="210" stroke-width="2.4" />
    <line x1="416" y1="191" x2="416" y2="209" stroke-width="2.1" />
    <line x1="428" y1="190" x2="428" y2="208" stroke-width="2.3" />
  </g>

  <!-- ============================================================ -->
  <!-- 5. SHORELINE REEDS & WETLAND GRASSES -->
  <!-- ============================================================ -->
  <g stroke="#082C35" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M3,242 Q5,226 9,216" />
    <path d="M7,244 Q11,224 15,212" />
    <path d="M12,244 Q17,228 21,218" />
    <path d="M19,246 Q23,232 26,222" />
    <path d="M98,228 Q101,217 105,210" />
    <path d="M103,229 Q107,215 111,206" />
    <path d="M109,230 Q114,218 117,211" />
    <path d="M248,226 Q251,215 255,207" />
    <path d="M253,227 Q258,212 263,203" />
    <path d="M259,228 Q265,216 269,208" />
  </g>

  <!-- ============================================================ -->
  <!-- 6. SOLID DEEP TEAL BASE (FOR PARTNER LOGOS & CREDITS) -->
  <!-- ============================================================ -->
  <path d="
    M0,242
    C45,240 115,246 195,243
    C265,240 345,245 432,242
    L432,297 L0,297 Z
  " fill="url(#baseGround)" />

  <path d="
    M0,242
    C45,240 115,246 195,243
    C265,240 345,245 432,242
  " fill="none" stroke="#D8B86C" stroke-width="0.8" opacity="0.65" />

</svg>
