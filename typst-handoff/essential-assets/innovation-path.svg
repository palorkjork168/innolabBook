<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 297" width="432mm" height="297mm">
  <defs>
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDE8E2" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#DDE8E2" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#D8B86C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="glowFront" cx="88%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#1b5a6c" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#144d5c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#114554" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient background depth on front cover area -->
  <circle cx="370" cy="85" r="130" fill="url(#glowFront)"/>

  <!-- Secondary subtle guide trail (fine dashed hairline) -->
  <path d="M 25 236 C 85 236, 145 235, 210 234 C 216 233.9, 222 233.8, 228 233.7 C 280 233, 325 231, 355 220 C 382 208, 400 168, 407 122 C 411 92, 412 68, 412 45"
        fill="none" stroke="#DDE8E2" stroke-width="0.65" stroke-dasharray="3,5" stroke-opacity="0.2"/>

  <!-- Primary Innovation Trajectory Path (smooth continuous organic curve) -->
  <path d="M 28 228 C 85 228, 145 227, 210 226 C 216 225.9, 222 225.8, 228 225.7 C 275 225, 320 222, 350 211 C 378 200, 396 162, 402 118 C 406 88, 406 64, 406 48"
        fill="none" stroke="url(#pathGrad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Upward directional pulse dash at terminal -->
  <path d="M 406 48 L 406 36"
        fill="none" stroke="#D8B86C" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Forward Beacon Arrowhead (refined minimalist geometric polygon) -->
  <polygon points="406,35 401,43 411,43" fill="#D8B86C"/>

  <!-- Clean architectural tick marks at key structural thresholds (No AI nodes/dots) -->
  <!-- Spine threshold guide -->
  <line x1="216" y1="221" x2="216" y2="231" stroke="#DDE8E2" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Front cover ascent threshold tick -->
  <line x1="350" y1="206" x2="350" y2="216" stroke="#D8B86C" stroke-width="1" stroke-opacity="0.6"/>
</svg>
